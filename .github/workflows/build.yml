# =============================================================================
# Build & Push — minicloud org standard (RTV-03a)
# Builds backend + frontend and pushes to Harbor (dev registry) + ghcr-org
# (durable prod registry), signs + SBOMs on main. Replaces the old DigitalOcean
# cd.yml. Deployment is GitOps (ArgoCD) in minicloud-gitops, not SSH.
# Org secrets (visibility: all): TS_OAUTH_*, MINICLOUD_CA_CERT, HARBOR_USER/
# PASSWORD, GITOPS_TOKEN, GPG_PRIVATE_KEY.
# =============================================================================
name: Build

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

env:
  HARBOR: harbor.10.0.0.200.nip.io
  GHCR_ORG: ghcr.io/andrelair-platform
  # The frontend no longer bakes the API/WS URL — it reads API_URL at RUNTIME
  # (window.__ENV__, injected by the layout). So ONE image serves dev + prod and
  # Kargo can promote the same artifact. Only the constant APP_NAME is still baked.
  FE_APP_NAME: Retrieva

jobs:
  build:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - uses: actions/checkout@v5

      - name: Compute metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          # Bare SHA on main (same tag pushed to BOTH Harbor + ghcr → one promotable
          # artifact for Kargo). dev branch keeps a dev- prefix for iteration builds.
          if [ "$BRANCH" = "main" ]; then TAG="${SHA}"; else TAG="${BRANCH}-${SHA}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"  >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.HARBOR }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.HARBOR }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to ghcr (org)
        if: steps.meta.outputs.branch == 'main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Compose image tags
        id: tags
        run: |
          T="${{ steps.meta.outputs.tag }}"
          HARBOR_REF="${{ env.HARBOR }}/library/retrieva-${{ matrix.service }}:${T}"
          TAGS="$HARBOR_REF"
          if [ "${{ steps.meta.outputs.branch }}" = "main" ]; then
            GHCR_REF="${{ env.GHCR_ORG }}/retrieva-${{ matrix.service }}:${{ steps.meta.outputs.sha }}"
            TAGS="${TAGS}
          ${GHCR_REF}"
            echo "ghcr=${GHCR_REF}" >> "$GITHUB_OUTPUT"
          fi
          echo "harbor=${HARBOR_REF}" >> "$GITHUB_OUTPUT"
          { echo 'list<<EOF'; echo "$TAGS"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      # Frontend reads API/WS at runtime (window.__ENV__) — no per-env baking. Only the
      # constant APP_NAME is passed as a build arg. Same image runs dev + prod.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_APP_NAME={0}', env.FE_APP_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: steps.meta.outputs.branch == 'main'
        uses: sigstore/cosign-installer@v3

      - name: Sign ghcr image (keyless)
        if: steps.meta.outputs.branch == 'main'
        run: cosign sign --yes ${{ steps.tags.outputs.ghcr }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        if: steps.meta.outputs.branch == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: SBOM + attach
        if: steps.meta.outputs.branch == 'main'
        run: |
          syft ${{ steps.tags.outputs.ghcr }}@${{ steps.build.outputs.digest }} -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx ${{ steps.tags.outputs.ghcr }}@${{ steps.build.outputs.digest }}
